<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f4ee" />
    <title>Élan — Pilates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar"><a class="brand" href="#">Élan<span>•</span></a><button class="avatar" aria-label="Mon compte">JD</button></header>
      <section class="intro">
        <p class="eyebrow">STUDIO DE PILATES</p>
        <h1>Un moment<br><em>pour vous.</em></h1>
        <p class="intro-copy">Choisissez votre séance et réservez en quelques secondes.</p>
      </section>

      <section aria-labelledby="calendar-title">
        <div class="section-heading"><h2 id="calendar-title">Prochaines séances</h2><button id="todayBtn" class="text-button">Aujourd'hui</button></div>
        <div class="date-strip" id="dateStrip" aria-label="Choisir un jour"></div>
      </section>

      <section class="schedule" aria-live="polite">
        <p class="date-label" id="selectedDateLabel"></p>
        <div id="classes" class="classes"><div class="loading">Chargement des séances…</div></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navigation principale"><a class="active" href="#"><span>⌂</span>Accueil</a><a href="#"><span>◷</span>Mes séances</a><a href="#"><span>◌</span>Profil</a></nav>

    <dialog id="bookingDialog" class="booking-dialog">
      <form method="dialog" id="bookingForm">
        <button class="close" value="cancel" aria-label="Fermer">×</button>
        <p class="eyebrow">VOTRE SÉANCE</p><h2 id="dialogTitle">Réserver</h2><p id="dialogMeta" class="dialog-meta"></p>
        <label>Votre prénom et nom<input name="name" autocomplete="name" required placeholder="Camille Martin" /></label>
        <label>Votre e-mail<input name="email" type="email" autocomplete="email" required placeholder="camille@email.com" /></label>
        <p class="small-print">En réservant, vous acceptez notre politique d'annulation (jusqu'à 12h avant le cours).</p>
        <button class="primary" id="submitBooking" type="submit">Confirmer ma réservation <span>→</span></button>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
    <script src="app.js" defer></script>
  </body>
</html>
