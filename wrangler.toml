name = "pilatelia"
compatibility_date = "2026-11-07"
main = "src/worker.js"
# Garde les variables ajoutées dans le dashboard Cloudflare à chaque déploiement.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"

# Rappel e-mail de la veille : vérifie chaque heure les séances dans ~24h.
[triggers]
crons = ["0 * * * *"]

