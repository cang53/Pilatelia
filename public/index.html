<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pilatelia — Réserver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <p class="brand">Pilatelia</p>
      <h1>Réservez votre séance</h1>
      <p class="muted">Choisissez un créneau, indiquez votre nom et votre e-mail, c’est tout.</p>
    </header>

    <nav class="week" aria-label="Semaine">
      <button class="icon-btn" id="prev" aria-label="Semaine précédente">‹</button>
      <p id="weekLabel" aria-live="polite"></p>
      <button class="icon-btn" id="next" aria-label="Semaine suivante">›</button>
    </nav>

    <div id="slots" aria-live="polite"></div>
  </main>

  <dialog id="dialog">
    <form id="form">
      <button type="button" class="close" data-close aria-label="Fermer">×</button>
      <h2 id="dialogTitle">Réserver</h2>
      <p class="muted" id="dialogMeta"></p>
      <label>Prénom et nom <input name="name" autocomplete="name" required maxlength="100" /></label>
      <label>E-mail <input name="email" type="email" autocomplete="email" required /></label>
      <p class="error" id="formError" role="alert"></p>
      <button class="btn btn-wide" type="submit">Confirmer</button>
    </form>
    <div id="done" hidden>
      <h2>C’est réservé ✓</h2>
      <p id="doneText"></p>
      <button type="button" class="btn btn-wide" data-close>Fermer</button>
    </div>
  </dialog>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
