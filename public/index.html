<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4ebdf" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1b140e" media="(prefers-color-scheme: dark)" />
  <title>Pilatelia — Réserver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <!-- Vue : Réserver -->
    <section id="view-book">
      <header class="hero">
        <span class="count" id="count1" hidden></span>
        <svg class="laurel l" viewBox="0 0 40 80" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 78C20 60 24 40 20 14"/></g><g fill="currentColor"><ellipse cx="22" cy="20" rx="6" ry="2.6" transform="rotate(-32 22 20)"/><ellipse cx="12" cy="30" rx="6" ry="2.6" transform="rotate(32 12 30)"/><ellipse cx="24" cy="34" rx="6" ry="2.6" transform="rotate(-28 24 34)"/><ellipse cx="11" cy="46" rx="6" ry="2.6" transform="rotate(34 11 46)"/><ellipse cx="22" cy="50" rx="6" ry="2.6" transform="rotate(-26 22 50)"/><ellipse cx="10" cy="62" rx="5.5" ry="2.4" transform="rotate(36 10 62)"/><circle cx="20" cy="11" r="2.4"/></g></svg>
        <svg class="laurel r" viewBox="0 0 40 80" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 78C20 60 24 40 20 14"/></g><g fill="currentColor"><ellipse cx="22" cy="20" rx="6" ry="2.6" transform="rotate(-32 22 20)"/><ellipse cx="12" cy="30" rx="6" ry="2.6" transform="rotate(32 12 30)"/><ellipse cx="24" cy="34" rx="6" ry="2.6" transform="rotate(-28 24 34)"/><ellipse cx="11" cy="46" rx="6" ry="2.6" transform="rotate(34 11 46)"/><ellipse cx="22" cy="50" rx="6" ry="2.6" transform="rotate(-26 22 50)"/><ellipse cx="10" cy="62" rx="5.5" ry="2.4" transform="rotate(36 10 62)"/><circle cx="20" cy="11" r="2.4"/></g></svg>
        <img class="brandmark" src="logo.jpg" width="74" height="74" alt="Pilatelia — Pilates Reformer Studio" />
        <div class="kicker" id="monthLabel">Pilatelia</div>
        <h1 class="title">Réserver une séance</h1>
        <p class="tagline">Et si tu poussais la bonne porte ?</p>
      </header>
      <nav class="week" aria-label="Semaine">
        <button class="nav-btn" id="prev" aria-label="Semaine précédente"></button>
        <span class="label" id="weekLabel" aria-live="polite"></span>
        <button class="nav-btn" id="next" aria-label="Semaine suivante"></button>
      </nav>
      <div class="days" id="days"></div>
      <div id="slots" aria-live="polite"></div>
    </section>

    <!-- Vue : Ma réservation -->
    <section id="view-mine" hidden>
      <div class="topbar">
        <div class="brand-inline">
          <img class="brandmark" src="logo.jpg" width="44" height="44" alt="Pilatelia" />
          <h1 class="title">Ma réservation</h1>
        </div>
        <span class="count" id="count2" hidden></span>
      </div>
      <div id="mine" aria-live="polite"></div>
    </section>
  </main>

  <nav class="tabbar">
    <div class="inner">
      <button class="tab on" data-view="book"><span class="ic-wrap" id="tabBookIc"></span>Réserver</button>
      <button class="tab" data-view="mine"><span class="ic-wrap" id="tabMineIc"></span>Ma réservation</button>
    </div>
  </nav>

  <!-- Feuille de réservation -->
  <dialog class="sheet" id="sheet">
    <div class="panel">
      <div class="grip"></div>
      <div id="bookStep">
        <h2 id="sheetTitle">Réserver</h2>
        <p class="meta" id="sheetMeta"></p>
        <div class="note">
          <span id="noteIc"></span>
          <p>Studio réservé aux femmes. Pas de compte : votre réservation reste sur cet appareil (3 au maximum).</p>
        </div>
        <form id="form">
          <label>Prénom et nom <input name="name" autocomplete="name" required maxlength="100" /></label>
          <label>E-mail <input name="email" type="email" autocomplete="email" required />
            <small class="muted">Pour recevoir votre confirmation et le rappel de la veille.</small></label>
          <p class="error" id="formError" role="alert"></p>
          <button class="btn btn-primary btn-block" type="submit">Confirmer la réservation</button>
        </form>
      </div>
      <div id="doneStep" class="confirm" hidden>
        <div class="badge" id="doneIc"></div>
        <h2>C'est réservé !</h2>
        <p class="muted">Votre place est gardée. On a hâte de vous voir.</p>
        <div class="ticket" id="doneTicket"></div>
        <button class="btn btn-primary btn-block" data-close>Voir ma réservation</button>
      </div>
    </div>
  </dialog>

  <p class="toast" id="toast" role="status"></p>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
