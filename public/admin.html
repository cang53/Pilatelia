<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#faf6f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#17130f" media="(prefers-color-scheme: dark)" />
  <title>Pilatelia — Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app admin">
    <!-- Connexion -->
    <form id="login" class="card login">
      <div class="kicker">Espace studio</div>
      <h1 class="title" style="margin:4px 0 16px">Connexion</h1>
      <label>Mot de passe <input type="password" name="password" autocomplete="current-password" required /></label>
      <p class="error" id="loginError" role="alert"></p>
      <button class="btn btn-primary btn-block">Entrer</button>
    </form>

    <div id="app" hidden>
      <div class="seg" role="tablist">
        <button class="on" data-tab="agenda">Agenda</button>
        <button data-tab="dispos">Disponibilités</button>
        <button data-tab="clients">Clientes</button>
      </div>

      <!-- Agenda -->
      <section id="agenda">
        <nav class="week" aria-label="Semaine">
          <button class="nav-btn" data-week="agenda" data-dir="-1" aria-label="Semaine précédente"></button>
          <span class="label" id="agendaLabel" aria-live="polite"></span>
          <button class="nav-btn" data-week="agenda" data-dir="1" aria-label="Semaine suivante"></button>
        </nav>
        <div id="agendaList" aria-live="polite"></div>
        <div class="barbtn">
          <button class="btn btn-primary btn-block" id="exportBtn"></button>
        </div>
      </section>

      <!-- Disponibilités -->
      <section id="dispos" hidden>
        <div class="repeat"><span id="repeatIc"></span><p>Ajoutez vos cours semaine par semaine. Option « répéter chaque semaine » pour une séance qui revient.</p></div>
        <form id="add" class="card" style="margin-bottom:14px">
          <h2 style="font-size:18px;margin-bottom:12px">Ajouter un cours</h2>
          <div class="grid2">
            <label>Jour <input type="date" name="date" required /></label>
            <label>Heure <input type="time" name="time" required value="09:00" step="300" /></label>
            <label>Durée (min) <input type="number" name="duration_minutes" required value="55" min="10" max="240" /></label>
            <label>Places <input type="number" name="capacity" required value="6" min="1" max="100" /></label>
            <label class="span2">Intitulé <input name="title" value="Pilates Reformer" maxlength="80" /></label>
            <label class="span2">Répéter chaque semaine jusqu'au <input type="date" name="until" />
              <small class="muted">Laisser vide pour une seule séance.</small></label>
          </div>
          <button class="btn btn-primary btn-block" style="margin-top:4px">Ajouter</button>
          <button type="button" class="btn btn-ghost btn-block" id="copy" style="margin-top:8px">Copier la semaine précédente</button>
        </form>
        <nav class="week" aria-label="Semaine">
          <button class="nav-btn" data-week="dispos" data-dir="-1" aria-label="Semaine précédente"></button>
          <span class="label" id="disposLabel" aria-live="polite"></span>
          <button class="nav-btn" data-week="dispos" data-dir="1" aria-label="Semaine suivante"></button>
        </nav>
        <div id="disposList" aria-live="polite"></div>
      </section>

      <!-- Clientes -->
      <section id="clients" hidden>
        <div class="stats" id="stats"></div>
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <h2 style="font-size:18px">Clientes</h2>
            <button class="btn btn-secondary" id="csv" style="padding:9px 14px;font-size:14px">Exporter CSV</button>
          </div>
          <div class="table-wrap"><table id="clientTable"></table></div>
        </div>
        <div class="card" style="margin-top:14px">
          <h2 style="font-size:18px;margin-bottom:8px">Réservations par mois</h2>
          <table id="monthTable"></table>
        </div>
      </section>
    </div>
  </main>

  <!-- Export story Instagram -->
  <dialog class="sheet" id="story">
    <div class="panel">
      <div class="grip"></div>
      <h2>Story de la semaine</h2>
      <p class="meta">Belle image à poster sur votre story Instagram.</p>
      <div class="story-stage"><canvas id="storyCanvas" width="1080" height="1920"></canvas></div>
      <p class="hint">Image 1080 × 1920, prête pour votre story.</p>
      <button class="btn btn-primary btn-block" id="shareStory"></button>
      <button class="btn btn-secondary btn-block" id="saveStory" style="margin-top:10px"></button>
      <button class="btn btn-ghost btn-block" data-close style="margin-top:4px">Fermer</button>
    </div>
  </dialog>

  <p class="toast" id="toast" role="status"></p>

  <script src="common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
